# Only what differs from btop's defaults. The process box stays off: its names and
# command lines would all be public.
color_theme = "/etc/glassbox/btop/themes/dank.theme"
theme_background = true
truecolor = true
rounded_corners = true
graph_symbol = "braille"
shown_boxes = "cpu mem net"
update_ms = 1000
disable_mouse = true
show_uptime = true
check_temp = true
show_coretemp = true
show_cpu_watts = false
show_battery = false
clock_format = "%X"
# The container's root is an overlay on the host's btrfs, so it reports the real disk
disks_filter = "/"
only_physical = false
use_fstab = false
net_iface = "enp1s0"
net_auto = true
save_config_on_exit = false
log_level = "DISABLED"
